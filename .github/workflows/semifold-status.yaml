name: Semifold Status
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: noctisynth/setup-semifold@9dc3b2e2f25d5db332322b29c3d3436c857ca1d9
        with:
          version: "0.3.4"
      - run: semifold config sync --check
      - run: semifold status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
